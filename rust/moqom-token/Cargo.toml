[package]
name = "moqom-token"
version = "0.1.0"
description = "Mint and verify MOQOM join tokens: compact JWS signed with ML-DSA-87"
readme = "README.md"
keywords = ["moq", "jws", "ml-dsa", "post-quantum", "token"]
categories = ["cryptography", "authentication"]
documentation = "https://docs.rs/moqom-token"
homepage = "https://moqom.dev/security/libraries/token/"
# The shared vectors live at the repository root, outside the package.
exclude = ["tests/vectors.rs"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
