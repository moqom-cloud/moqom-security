[package]
name = "moqom-mls"
version = "0.1.0"
description = "The MOQOM subset of MLS (RFC 9420): ML-KEM-1024 and ML-DSA-87 key packages, Welcome, commits, SFrame exporter and audience envelopes"
readme = "README.md"
keywords = ["mls", "rfc9420", "post-quantum", "ml-kem", "e2ee"]
categories = ["cryptography", "network-programming"]
documentation = "https://docs.rs/moqom-mls"
homepage = "https://moqom.dev/security/libraries/mls/"
# The shared vectors live at the repository root, outside the package.
exclude = ["tests/vectors.rs", "tests/generate.rs"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
aws-lc-sys = "0.45"
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
