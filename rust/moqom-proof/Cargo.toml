[package]
name = "moqom-proof"
version = "0.1.0"
description = "Device-bound, single-use, certificate-bound proof of possession for MoQ sessions: ML-DSA-65 and ES256"
readme = "README.md"
keywords = ["moq", "dpop", "proof-of-possession", "ml-dsa", "post-quantum"]
categories = ["cryptography", "authentication"]
documentation = "https://docs.rs/moqom-proof"
homepage = "https://moqom.dev/security/libraries/proof/"
# The shared vectors live at the repository root, outside the package.
exclude = ["tests/vectors.rs"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
