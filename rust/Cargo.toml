[workspace]
resolver = "3"
members = ["moqom-token", "moqom-proof", "moqom-sframe", "moqom-mls"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Elliott Wave LLC"]
repository = "https://github.com/moqom-cloud/moqom-security"

[workspace.dependencies]
aws-lc-rs = "1.18"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
