name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub-hosted runners only. This repository is public and takes pull requests
# from forks, which must never reach a machine we own.
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97
      - run: cargo test --workspace --locked
